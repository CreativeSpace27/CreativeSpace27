<svg width="860" height="280" viewBox="0 0 860 280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Gradient ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>

    <!-- Glow filter for name -->
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Badge bg clips -->
    <clipPath id="c1"><rect x="55" y="220" width="178" height="30" rx="15"/></clipPath>
    <clipPath id="c2"><rect x="244" y="220" width="180" height="30" rx="15"/></clipPath>
    <clipPath id="c3"><rect x="435" y="220" width="160" height="30" rx="15"/></clipPath>
    <clipPath id="c4"><rect x="606" y="220" width="168" height="30" rx="15"/></clipPath>

    <!-- Subtle grid pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff06" stroke-width="0.5"/>
    </pattern>

    <!-- Radial glow behind avatar -->
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" fill="#0d1117"/>
  <!-- Grid overlay -->
  <rect width="860" height="280" fill="url(#grid)"/>

  <!-- Ambient glow dots -->
  <circle cx="80"  cy="50"  r="60" fill="#7c3aed" opacity="0.06"/>
  <circle cx="780" cy="230" r="80" fill="#00d9ff" opacity="0.05"/>
  <circle cx="430" cy="140" r="120" fill="#00d9ff" opacity="0.03"/>

  <!-- Avatar glow halo -->
  <circle cx="430" cy="72" r="70" fill="url(#avatarGlow)"/>

  <!-- Gradient ring (outer) -->
  <circle cx="430" cy="72" r="46" fill="none" stroke="url(#ringGrad)" stroke-width="3"/>

  <!-- Inner dark circle -->
  <circle cx="430" cy="72" r="41" fill="#0d1117"/>

  <!-- PB Initials -->
  <text x="430" y="80"
        text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="20"
        font-weight="700"
        fill="#00d9ff"
        filter="url(#glow)">PB</text>

  <!-- Name -->
  <text x="430" y="145"
        text-anchor="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="30"
        font-weight="700"
        fill="#e6edf3"
        letter-spacing="-0.5">Piyush Bhadade</text>

  <!-- Tagline -->
  <text x="430" y="175"
        text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="13"
        fill="#00d9ff"
        letter-spacing="0.2">&gt; Backend Engineer  ·  Agentic AI Builder  ·  Problem Solver_</text>

  <!-- ── Badge 1: Backend Architecture ── -->
  <rect x="55" y="220" width="178" height="30" rx="15" fill="#00d9ff0d" stroke="#00d9ff55" stroke-width="1"/>
  <text x="144" y="239" text-anchor="middle" font-family="'Segoe UI', system-ui" font-size="11.5" font-weight="600" fill="#00d9ff">&#9881; Backend Architecture</text>

  <!-- ── Badge 2: Agentic AI Systems ── -->
  <rect x="244" y="220" width="180" height="30" rx="15" fill="#7c3aed0d" stroke="#7c3aed55" stroke-width="1"/>
  <text x="334" y="239" text-anchor="middle" font-family="'Segoe UI', system-ui" font-size="11.5" font-weight="600" fill="#a78bfa">&#9679; Agentic AI Systems</text>

  <!-- ── Badge 3: Android · Flutter ── -->
  <rect x="435" y="220" width="160" height="30" rx="15" fill="#ff6b350d" stroke="#ff6b3555" stroke-width="1"/>
  <text x="515" y="239" text-anchor="middle" font-family="'Segoe UI', system-ui" font-size="11.5" font-weight="600" fill="#ff6b35">&#9651; Android · Flutter</text>

  <!-- ── Badge 4: SIH 2025 Finalist ── -->
  <rect x="606" y="220" width="168" height="30" rx="15" fill="#22c55e0d" stroke="#22c55e55" stroke-width="1"/>
  <text x="690" y="239" text-anchor="middle" font-family="'Segoe UI', system-ui" font-size="11.5" font-weight="600" fill="#4ade80">&#9733; SIH 2025 Finalist</text>
</svg>
